version: '3.8'

services:
  # Celery Worker for email queue
  celery-email-worker:
    build: .
    container_name: sababisha-celery-email-worker
    command: celery -A celery_config:app worker --queues=celery --concurrency=2 --hostname=email_worker@%h --loglevel=info
    volumes:
      - ./.env:/app/.env:ro  # Mount .env as read-only volume (NOT in image)
      - ./Images:/app/Images:ro  # Read-only access to logo
      - ./logs:/var/log/celery
    depends_on:
      - celery-beat
    network_mode: host  # Use host network to access host Redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_config:app inspect ping -d celery@email_worker"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker for log queue
  celery-log-worker:
    build: .
    container_name: sababisha-celery-log-worker
    command: celery -A celery_config:app worker --queues=log-queue --concurrency=1 --hostname=log_worker@%h --loglevel=info
    volumes:
      - ./.env:/app/.env:ro  # Mount .env as read-only volume (NOT in image)
      - ./logs:/var/log/celery
    network_mode: host  # Use host network to access host Redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_config:app inspect ping -d celery@log_worker"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Beat Scheduler
  celery-beat:
    build: .
    container_name: sababisha-celery-beat
    command: celery -A celery_config:app beat --loglevel=info
    volumes:
      - ./.env:/app/.env:ro  # Mount .env as read-only volume (NOT in image)
      - ./logs:/var/log/celery
      - beat-schedule:/app  # Persist beat schedule
    network_mode: host  # Use host network to access host Redis
    restart: unless-stopped

  # Flower - Celery monitoring tool (optional but recommended)
  # flower:
  #   build: .
  #   container_name: sababisha-flower
  #   command: celery -A celery_config:app flower --port=5555
  #   env_file:
  #     - .env
  #   network_mode: host  # Use host network to access host Redis and expose port 5555
  #   restart: unless-stopped

volumes:
  beat-schedule:
  logs:
